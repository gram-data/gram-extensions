# Keeps versions.toml in step with the latest release of every registry entry.
name: Update versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [registry.toml]

permissions:
  contents: write

concurrency:
  group: update-versions

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Refresh versions.toml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-versions.py
      - name: Commit changes
        run: |
          if git diff --quiet -- versions.toml && [ -z "$(git ls-files --others --exclude-standard versions.toml)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.toml
          git commit -m "chore: update extension versions"
          git push
